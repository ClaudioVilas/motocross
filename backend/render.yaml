# Render.yaml for backend deployment
services:
  - type: web
    name: motocross-api
    runtime: dotnet
    plan: free
    buildCommand: dotnet restore && dotnet build --configuration Release
    startCommand: cd src/Api && dotnet run --no-build --configuration Release --urls http://0.0.0.0:$PORT
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: motocross-db
          property: connectionString
      - key: Frontend__Url
        sync: false

databases:
  - name: motocross-db
    databaseName: motocross
    plan: free
